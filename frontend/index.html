<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tunnel Coupling Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 32px;
      max-width: 560px;
      width: 100%;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 1.2rem; font-weight: 600; color: #fff; }
    .github-link { display: flex; align-items: center; color: #888; transition: color 0.15s; }
    .github-link:hover { color: #eee; }
    .github-link svg { width: 22px; height: 22px; display: block; }
    .buttons { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    button, .upload-btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    button:hover, .upload-btn:hover { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4466ff; color: white; flex: 1; }
    .btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #333; }
    canvas {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      display: none;
      background: #0d0d0d;
    }
    canvas.visible { display: block; }
    .result { margin-top: 20px; display: none; }
    .result.visible { display: block; }
    .t-value { font-size: 2.4rem; font-weight: 700; color: #4466ff; letter-spacing: -0.02em; }
    .t-true { margin-top: 4px; font-size: 0.85rem; color: #555; }
    .error { margin-top: 16px; font-size: 0.85rem; color: #f66; display: none; }
    .error.visible { display: block; }
    .hint { font-size: 0.78rem; color: #555; margin-bottom: 8px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #111; border-radius: 8px; padding: 4px; }
    .tab-btn {
      flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent;
      color: #888; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .tab-btn.active { background: #2a2a2a; color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .slider-row { margin-bottom: 14px; }
    .slider-row label {
      display: flex; justify-content: space-between; font-size: 0.8rem; color: #ccc; margin-bottom: 6px;
    }
    .slider-row label span { color: #4466ff; font-family: monospace; }
    .slider-row input[type="range"] { width: 100%; accent-color: #4466ff; }
    .slider-hint { font-size: 0.72rem; color: #555; margin-top: -8px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Tunnel Coupling Predictor</h1>
    <a class="github-link" href="https://github.com/b-adamson/quantum-coupling-ML" target="_blank" rel="noopener noreferrer" aria-label="View on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab_btn_paste" onclick="switchTab('paste')">Paste Signal</button>
    <button class="tab-btn" id="tab_btn_build" onclick="switchTab('build')">Build Your Own</button>
  </div>

  <div class="tab-panel active" id="tab_paste">
    <div class="buttons">
      <button class="btn-secondary" onclick="loadExample()">Load Example</button>
      <button class="btn-primary" id="predict_btn" onclick="predict()">Predict</button>
    </div>

    <p class="hint">1D array of sensor signal values along a detuning sweep through the interdot transition.</p>
    <textarea id="array_input" placeholder="Paste a 1D array here e.g. [0.1, 0.15, 0.3, ...]"
      style="width:100%;height:60px;margin-bottom:12px;padding:10px;background:#0d0d0d;color:#eee;border:1px solid #333;border-radius:6px;font-family:monospace;font-size:0.75rem;resize:vertical;"
      oninput="handleInput(this.value)"></textarea>
  </div>

  <div class="tab-panel" id="tab_build">
    <div class="slider-row">
      <label>Tunnel coupling t <span id="val_t">0.075</span></label>
      <input type="range" id="slider_t" min="0" max="0.15" step="0.001" value="0.075"
        oninput="onSliderInput('t')" onchange="runSimulate()">
    </div>

    <div class="slider-row">
      <label>Dot–dot coupling (Cdd off-diag) <span id="val_cdd_off">0.08</span></label>
      <input type="range" id="slider_cdd_off" min="0.01" max="0.15" step="0.001" value="0.08"
        oninput="onSliderInput('cdd_off')" onchange="runSimulate()">
    </div>

    <div class="slider-row">
      <label>Gate 1 → Dot 2 crosstalk <span id="val_cdg_cross0">0.1</span></label>
      <input type="range" id="slider_cdg_cross0" min="0.05" max="0.2" step="0.001" value="0.1"
        oninput="onSliderInput('cdg_cross0')" onchange="runSimulate()">
    </div>

    <div class="slider-row">
      <label>Gate 2 → Dot 1 crosstalk <span id="val_cdg_cross1">0.1</span></label>
      <input type="range" id="slider_cdg_cross1" min="0.05" max="0.2" step="0.001" value="0.1"
        oninput="onSliderInput('cdg_cross1')" onchange="runSimulate()">
    </div>

    <div class="slider-row">
      <label>Sensor noise (untrained — stress test) <span id="val_noise_std">0</span></label>
      <input type="range" id="slider_noise_std" min="0" max="0.05" step="0.001" value="0"
        oninput="onSliderInput('noise_std')" onchange="runSimulate()">
    </div>
    <p class="slider-hint">Training data had zero noise, so the model has never seen this — expect it to degrade.</p>

    <button class="btn-primary" style="width:100%" id="simulate_btn" onclick="runSimulate()">Simulate + Predict</button>
  </div>

  <canvas id="trace_canvas" width="520" height="180"></canvas>

  <div class="result" id="result">
    <div class="t-value" id="t_value"></div>
    <div class="t-true" id="t_true"></div>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
  // In production both /api/predict and /api/simulate are separate Vercel functions
  // reachable at the same origin. In local dev (VS Code Live Server on :5500) they're
  // two separate local http.server processes on different ports -- see README.
  var isLocalDev = window.location.port === "5500";
  var API_URL = (isLocalDev ? "http://localhost:5000" : "") + "/api/predict";
  var SIMULATE_URL = (isLocalDev ? "http://localhost:5001" : "") + "/api/simulate";

  var pendingTrueT = null;

  function switchTab(name) {
    document.getElementById("tab_paste").classList.toggle("active", name === "paste");
    document.getElementById("tab_build").classList.toggle("active", name === "build");
    document.getElementById("tab_btn_paste").classList.toggle("active", name === "paste");
    document.getElementById("tab_btn_build").classList.toggle("active", name === "build");
  }

  function onSliderInput(key) {
    document.getElementById("val_" + key).textContent = document.getElementById("slider_" + key).value;
  }

  function parseSignal(text) {
    text = text.trim();
    var data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error("Expected a JSON array");
    if (Array.isArray(data[0])) throw new Error("Expected a 1D array, got 2D");
    return data.map(Number);
  }

  function drawTrace(signal) {
    var canvas = document.getElementById("trace_canvas");
    var ctx = canvas.getContext("2d");
    var W = canvas.width, H = canvas.height;
    var pad = { top: 16, bottom: 28, left: 48, right: 16 };
    var plotW = W - pad.left - pad.right;
    var plotH = H - pad.top - pad.bottom;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0d0d0d";
    ctx.fillRect(0, 0, W, H);

    var min = Math.min(...signal), max = Math.max(...signal);
    var range = max - min || 1;
    var n = signal.length;

    function sx(i) { return pad.left + (i / (n - 1)) * plotW; }
    function sy(v) { return pad.top + plotH - ((v - min) / range) * plotH; }

    // Axes
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, pad.top + plotH);
    ctx.lineTo(pad.left + plotW, pad.top + plotH);
    ctx.stroke();

    // Centre line (ε = 0)
    var cx = pad.left + plotW / 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "#444";
    ctx.beginPath();
    ctx.moveTo(cx, pad.top);
    ctx.lineTo(cx, pad.top + plotH);
    ctx.stroke();
    ctx.setLineDash([]);

    // Trace
    ctx.strokeStyle = "#4466ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx(0), sy(signal[0]));
    for (var i = 1; i < n; i++) ctx.lineTo(sx(i), sy(signal[i]));
    ctx.stroke();

    // Axis labels
    ctx.fillStyle = "#bbb";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Detuning  ε", pad.left + plotW / 2, H - 4);
    ctx.fillText("−0.5", pad.left + 4, H - 14);
    ctx.fillText("0", cx, H - 14);
    ctx.fillText("+0.5", pad.left + plotW, H - 14);
    ctx.textAlign = "right";
    ctx.fillText(max.toFixed(3), pad.left - 4, pad.top + 8);
    ctx.fillText(min.toFixed(3), pad.left - 4, pad.top + plotH);

    // Y axis label
    ctx.save();
    ctx.translate(11, pad.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "center";
    ctx.fillText("I(ε)", 0, 0);
    ctx.restore();

    canvas.classList.add("visible");
  }

  function handleInput(text) {
    try {
      var signal = parseSignal(text);
      drawTrace(signal);
      document.getElementById("error").classList.remove("visible");
    } catch (e) {
      // Don't show error while still typing
    }
  }

  async function loadExample() {
    var sampleUrl = (isLocalDev ? "http://localhost:5000" : "") + "/api/sample";
    try {
      var resp = await fetch(sampleUrl);
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.error || resp.statusText);
      var text = JSON.stringify(data.signal);
      document.getElementById("array_input").value = text;
      drawTrace(data.signal);
      pendingTrueT = data.true_t;
      document.getElementById("t_true").textContent = "True t = " + data.true_t.toFixed(5);
      document.getElementById("t_true").style.display = "block";
      document.getElementById("error").classList.remove("visible");
    } catch (e) {
      document.getElementById("error").textContent = "Could not load sample: " + e.message;
      document.getElementById("error").classList.add("visible");
    }
  }

  async function predict() {
    var raw = document.getElementById("array_input").value.trim();
    var errEl = document.getElementById("error");
    var resultEl = document.getElementById("result");
    var btn = document.getElementById("predict_btn");

    errEl.classList.remove("visible");
    resultEl.classList.remove("visible");

    var signal;
    try {
      signal = parseSignal(raw);
    } catch (e) {
      errEl.textContent = "Invalid input: " + e.message;
      errEl.classList.add("visible");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Predicting…";

    try {
      var resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ signal: signal }),
      });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || data.error || resp.statusText);

      document.getElementById("t_value").textContent = "t = " + data.t.toFixed(4);
      resultEl.classList.add("visible");
    } catch (e) {
      errEl.textContent = "Prediction failed: " + e.message;
      errEl.classList.add("visible");
    } finally {
      btn.disabled = false;
      btn.textContent = "Predict";
    }
  }

  async function runSimulate() {
    var errEl = document.getElementById("error");
    var resultEl = document.getElementById("result");
    var btn = document.getElementById("simulate_btn");

    errEl.classList.remove("visible");
    resultEl.classList.remove("visible");

    var params = {
      t: parseFloat(document.getElementById("slider_t").value),
      cdd_off: parseFloat(document.getElementById("slider_cdd_off").value),
      cdg_cross0: parseFloat(document.getElementById("slider_cdg_cross0").value),
      cdg_cross1: parseFloat(document.getElementById("slider_cdg_cross1").value),
      noise_std: parseFloat(document.getElementById("slider_noise_std").value),
    };

    btn.disabled = true;
    btn.textContent = "Simulating…";

    try {
      var resp = await fetch(SIMULATE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(params),
      });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || data.error || resp.statusText);

      document.getElementById("array_input").value = JSON.stringify(data.signal);
      drawTrace(data.signal);
      pendingTrueT = data.true_t;
      document.getElementById("t_true").textContent = "True t = " + data.true_t.toFixed(5);
      document.getElementById("t_true").style.display = "block";

      btn.textContent = "Simulate + Predict";
      btn.disabled = false;

      await predict();
    } catch (e) {
      errEl.textContent = "Simulation failed: " + e.message;
      errEl.classList.add("visible");
      btn.disabled = false;
      btn.textContent = "Simulate + Predict";
    }
  }
</script>
</body>
</html>
